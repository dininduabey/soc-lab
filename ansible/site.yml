---
- name: Apply baseline hardening to all lab hosts
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common

- name: Install Docker where containers will run
  hosts: role_victim:role_siem
  become: true
  gather_facts: true
  roles:
    - docker

- name: Deploy the vulnerable target application
  hosts: role_victim
  become: true
  gather_facts: true
  roles:
    - dvwa

- name: Front DVWA with nginx for structured access logging
  hosts: role_victim
  become: true
  gather_facts: true
  roles:
    - nginx

- name: Install attack tooling on the bastion
  hosts: role_bastion
  become: true
  gather_facts: true
  roles:
    - attacker
