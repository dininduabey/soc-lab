---
- name: Apply baseline hardening to all lab hosts
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common

- name: Install Docker where containers will run
  hosts: role_victim:role_siem:role_bastion
  become: true
  gather_facts: true
  roles:
    - docker

- name: Deploy the vulnerable target application
  hosts: role_victim
  become: true
  gather_facts: true
  roles:
    - dvwa

- name: Front DVWA with nginx and expose metrics
  hosts: role_victim
  become: true
  gather_facts: true
  roles:
    - nginx
    - metrics_target

- name: Install attack tooling on the bastion
  hosts: role_bastion
  become: true
  gather_facts: true
  roles:
    - attacker

- name: Deploy the monitoring stack on the bastion
  hosts: role_bastion
  become: true
  gather_facts: true
  roles:
    - monitoring
