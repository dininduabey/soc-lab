---
- name: Enable nginx stub_status for the exporter
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/stub_status.conf
    mode: '0644'
    content: |
      # Local-only metrics endpoint consumed by nginx-prometheus-exporter
      server {
          listen 127.0.0.1:8081;
          location /stub_status {
              stub_status;
          }
      }
  become: true
  notify: Reload nginx

- name: Run node_exporter (host metrics)
  community.docker.docker_container:
    name: node_exporter
    image: "prom/node-exporter:v{{ metrics_target_node_exporter_version }}"
    state: started
    restart_policy: unless-stopped
    memory: "64m"
    published_ports:
      - "{{ metrics_target_metrics_bind_address }}:{{ metrics_target_node_exporter_port }}:9100"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
  become: true

- name: Run nginx-prometheus-exporter
  community.docker.docker_container:
    name: nginx_exporter
    image: "nginx/nginx-prometheus-exporter:1.3.0"
    state: started
    restart_policy: unless-stopped
    memory: "32m"
    network_mode: host
    command:
      - '--nginx.scrape-uri=http://127.0.0.1:8081/stub_status'
      - '--web.listen-address={{ metrics_target_metrics_bind_address }}:{{ metrics_target_nginx_exporter_port }}'
  become: true

- name: Find the position of the REJECT catch-all
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail;
      iptables -L INPUT --line-numbers -n
      | awk '$2=="REJECT" {print $1; exit}'
  register: metrics_target_reject_line
  changed_when: false
  become: true

- name: Allow metrics scraping from the VCN
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    source: "10.0.0.0/16"
    jump: ACCEPT
    action: insert
    rule_num: "{{ metrics_target_reject_line.stdout | default('1') | trim }}"
    comment: "soc-lab: metrics scrape {{ item }}"
  loop:
    - "{{ metrics_target_node_exporter_port }}"
    - "{{ metrics_target_nginx_exporter_port }}"
  become: true
  notify: Persist iptables

- name: Create promtail config directory
  ansible.builtin.file:
    path: /opt/promtail
    state: directory
    mode: '0755'
  become: true

- name: Deploy promtail config
  ansible.builtin.copy:
    dest: /opt/promtail/promtail.yml
    mode: '0644'
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0
      positions:
        filename: /tmp/positions.yaml
      clients:
        - url: {{ metrics_target_loki_endpoint }}/loki/api/v1/push
      scrape_configs:
        - job_name: nginx-access
          static_configs:
            - targets: [localhost]
              labels:
                job: nginx_access
                host: web-victim
                __path__: /var/log/nginx/dvwa_access.log
  become: true
  notify: Restart promtail

- name: Run promtail on the victim
  community.docker.docker_container:
    name: promtail
    image: grafana/promtail:3.2.0
    state: started
    restart_policy: unless-stopped
    memory: "96m"
    volumes:
      - /opt/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - promtail-pos:/tmp
    command: -config.file=/etc/promtail/promtail.yml
    network_mode: host
  become: true
