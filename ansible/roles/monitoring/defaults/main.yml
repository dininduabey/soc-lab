---
monitoring_dir: /opt/monitoring
monitoring_bind: "127.0.0.1"          # tunnel-only; nothing on a public port
monitoring_grafana_port: 3000
monitoring_prometheus_port: 9090
monitoring_loki_port: 3100
# Scrape targets — the victim's exporters
monitoring_victim_ip: "{{ hostvars[groups['role_victim'][0]]['private_ip'] }}"
monitoring_prometheus_retention: "3d"  # trimmed hard for a 1GB box
monitoring_private_ip: "{{ private_ip | default(ansible_default_ipv4.address) }}"
