---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Set timezone
  community.general.timezone:
    name: "{{ common_system_timezone }}"
  become: true
  register: common_tz
  failed_when:
    - common_tz.failed | default(false)
    - "'timedatectl' not in (common_tz.msg | default(''))"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  become: true

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
    lock_timeout: 300
  become: true

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
      - curl
      - vim
      - htop
      - net-tools
      - auditd
    state: present
    lock_timeout: 300
  become: true

- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: '0755'
  become: true

- name: Deploy SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-soclab-hardening.conf
    mode: '0644'
    content: |
      # Managed by Ansible. Named 01- so it is read before cloud-init's
      # drop-in; sshd uses the first value it encounters for each keyword.
      PermitRootLogin {{ common_ssh_permit_root_login }}
      PasswordAuthentication {{ common_ssh_password_authentication }}
      MaxAuthTries {{ common_ssh_max_auth_tries }}
      ClientAliveInterval {{ common_ssh_client_alive_interval }}
      X11Forwarding no
  become: true
  notify: Restart sshd

- name: Validate the full sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  become: true

- name: Configure fail2ban for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    content: |
      [DEFAULT]
      bantime  = {{ common_fail2ban_bantime }}
      findtime = {{ common_fail2ban_findtime }}
      maxretry = {{ common_fail2ban_maxretry }}
      backend  = systemd

      [sshd]
      enabled = true
  become: true
  notify: Restart fail2ban

- name: Enable and start services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - fail2ban
    - auditd
  become: true

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  become: true

- name: Check for existing swap
  ansible.builtin.command: swapon --show
  register: common_swap
  changed_when: false
  become: true

- name: Create swap file
  ansible.builtin.command: fallocate -l 2G /swapfile
  args:
    creates: /swapfile
  become: true
  when: common_swap.stdout == ""

- name: Secure the swap file
  ansible.builtin.file:
    path: /swapfile
    mode: '0600'
  become: true
  when: common_swap.stdout == ""

- name: Format the swap file
  ansible.builtin.command: mkswap /swapfile
  register: common_mkswap
  changed_when: "'Setting up swapspace' in common_mkswap.stdout"
  failed_when:
    - common_mkswap.rc != 0
    - "'already' not in common_mkswap.stderr"
  become: true
  when: common_swap.stdout == ""

- name: Enable swap and persist it
  ansible.builtin.shell: |
    swapon /swapfile
    grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  args:
    executable: /bin/bash
  register: common_swapon
  changed_when: true
  become: true
  when: common_swap.stdout == ""

- name: Tune swappiness low (prefer RAM, swap only under pressure)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    sysctl_set: true
  become: true
