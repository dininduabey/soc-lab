---
wazuh_manager_wazuh_version: "4.14"
wazuh_manager_wazuh_node_name: "soc-core"
wazuh_manager_wazuh_node_ip: "{{ private_ip | default(ansible_default_ipv4.address) }}"

# JVM heap for the indexer — ~1/3 of the 12 GB host, leaving room
# for the manager, dashboard (Node.js), Filebeat, and the OS.
wazuh_manager_wazuh_indexer_heap: "4g"

# Working dir where certs and downloaded tools live during install.
wazuh_manager_wazuh_install_dir: /opt/wazuh-install
